<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réinitialisation du mot de passe</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f1fa;font-family:Inter,Arial,sans-serif;color:#1f2a44;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr><td style="font-size:20px;font-weight:600;color:#2c3fc4;">☺ Mood Map</td></tr>
            <tr><td style="padding-top:24px;font-size:22px;font-weight:700;">Mot de passe oublié ?</td></tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6;color:#5b6478;">
                Bonjour {{firstName}}, vous avez demandé à réinitialiser votre mot de passe.
                Ce lien est valable {{ttl}} minutes.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;" align="center">
                <a href="{{link}}" style="display:inline-block;background:#2c3fc4;color:#ffffff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:10px;">Choisir un nouveau mot de passe</a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:12px;color:#8a92a6;">
                Si vous n'êtes pas à l'origine de cette demande, ignorez simplement cet e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
