<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code de vérification</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f1fa;font-family:Inter,Arial,sans-serif;color:#1f2a44;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr><td style="font-size:20px;font-weight:600;color:#2c3fc4;">☺ Mood Map</td></tr>
            <tr><td style="padding-top:24px;font-size:22px;font-weight:700;">Votre code de vérification</td></tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6;color:#5b6478;">
                Bonjour {{firstName}}, saisissez ce code dans l’application. Il est valable 10 minutes.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:34px;font-weight:700;letter-spacing:8px;color:#2c3fc4;" align="center">{{code}}</td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:12px;color:#8a92a6;">
                Si vous n’êtes pas à l’origine de cette demande, quelqu’un connaît votre mot de passe : changez-le dès que possible.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
