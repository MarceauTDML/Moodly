<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bienvenue sur Mood Map</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f1fa;font-family:Inter,Arial,sans-serif;color:#1f2a44;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr><td style="font-size:20px;font-weight:600;color:#2c3fc4;">☺ Mood Map</td></tr>
            <tr><td style="padding-top:24px;font-size:24px;font-weight:700;">Bienvenue {{firstName}} !</td></tr>
            <tr>
              <td style="padding-top:12px;font-size:15px;line-height:1.6;color:#5b6478;">
                Votre entreprise utilise Mood Map pour suivre, de façon <strong>100&nbsp;% anonyme</strong>,
                comment se portent ses collaborateurs. Activez votre compte en choisissant votre mot de passe.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;" align="center">
                <a href="{{link}}" style="display:inline-block;background:#2c3fc4;color:#ffffff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:10px;">Activer mon compte</a>
              </td>
            </tr>
            <tr><td style="padding-top:24px;font-size:12px;color:#8a92a6;">Utilisez votre adresse e-mail professionnelle pour activer votre compte.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
