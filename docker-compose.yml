name: moodmap-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: moodmap-postgres
    restart: unless-stopped
    network_mode: bridge
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodmap}
      POSTGRES_DB: ${POSTGRES_DB:-moodmap}
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    ports:
      - "2054:5432"
    volumes:
      - moodmap-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moodmap} -d ${POSTGRES_DB:-moodmap}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moodmap-pgdata:
